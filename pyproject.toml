[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-cam-tade-ef"
version = "0.1.0"
description = "Paper-traceable TADE-EF implementation for event-based UAV detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
tabpfn = ["tabpfn==8.1.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
tade-ef = "tade_ef.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

